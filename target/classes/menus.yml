# ============================================================
#  QSDungeons - Editor GUI
#  Todos los textos usan MiniMessage:
#  https://docs.advntr.dev/minimessage/format.html
#
#  Puedes cambiar:
#    - title, size y list-slots de cada menu
#    - material, slot, name, lore, amount y glow de cada item
#    - todos los mensajes y prompts
#
#  Los identificadores de los items (las claves dentro de "items")
#  son fijos: el plugin los usa para saber que accion ejecutar.
#  Los slots son libres mientras no se solapen.
#
#  Colores de placeholder:
#    {dungeon} {dungeon_name} {state} {players} {max_players}
#    {spawn} {boss} {chest} {reward} {loot} {entity} {value}
#    {enabled} {ready} {location} {loot_table} ...
# ============================================================

format:
  yes: "<green>Si</green>"
  no: "<red>No</red>"
  none: "<dark_gray>-</dark_gray>"
  vanilla: "<gray>Vanilla</gray>"
  mythic: "<light_purple>MythicMobs</light_purple>"

messages:
  saved: "{prefix}<green>Cambios guardados en <white>{dungeon}</white>."
  created: "{prefix}<green>Creado <white>{dungeon}</white>."
  deleted: "{prefix}<green>Eliminado <white>{dungeon}</white>."
  reloaded: "{prefix}<green>Configuracion recargada."
  invalid-id: "{prefix}<red>ID invalido: <white>{value}</white>. Usa letras, numeros, guion o guion bajo."
  invalid-value: "{prefix}<red>Valor invalido: <white>{value}</white>."
  exists: "{prefix}<red>Ya existe <white>{dungeon}</white>."
  cancelled: "{prefix}<gray>Accion cancelada."
  target-not-chest: "{prefix}<red>Mira un cofre para registrarlo."
  target-not-block: "{prefix}<red>Mira un bloque para registrarlo."
  empty-hand: "{prefix}<red>Debes tener un item en la mano."
  region-missing: "{prefix}<red>Marca primero la esquina 1 y la esquina 2."
  region-saved: "{prefix}<green>Region guardada para <white>{dungeon}</white>."
  position-set: "{prefix}<green>Posicion guardada para <white>{dungeon}</white>."
  error: "{prefix}<red>Ha ocurrido un error. Revisa la consola."

prompts:
  dungeon-id: "{prefix}<gray>Escribe el <white>ID</white> de la nueva dungeon en el chat. <dark_gray>(cancelar para salir)"
  spawn-id: "{prefix}<gray>Escribe el <white>ID</white> del nuevo spawn para <white>{dungeon}</white>. <dark_gray>(cancelar para salir)"
  boss-id: "{prefix}<gray>Escribe el <white>ID</white> del nuevo jefe para <white>{dungeon}</white>. <dark_gray>(cancelar para salir)"
  loot-id: "{prefix}<gray>Escribe el <white>ID</white> de la nueva tabla de loot para <white>{dungeon}</white>. <dark_gray>(cancelar para salir)"
  chest-id: "{prefix}<gray>Escribe el <white>ID</white> del nuevo cofre para <white>{dungeon}</white>. <dark_gray>(cancelar para salir)"
  reward-id: "{prefix}<gray>Escribe el <white>ID</white> del nuevo bloque premiado para <white>{dungeon}</white>. <dark_gray>(cancelar para salir)"
  value: "{prefix}<gray>Ajuste <white>{key}</white> (actual: <white>{current}</white>). Escribe el nuevo valor. <dark_gray>(cancelar para salir)"
  rolls: "{prefix}<gray>Escribe las tiradas de <white>{loot}</white>. Ejemplo: <white>1-3</white> o <white>2</white>. <dark_gray>(cancelar para salir)"

menus:

  main:
    title: "<dark_gray>» <gradient:#8e2de2:#4a00e0><bold>QSDungeons</bold></gradient> <dark_gray>«"
    size: 27
    items:
      fill:
        material: GRAY_STAINED_GLASS_PANE
        name: " "
      dungeons:
        slot: 11
        material: CHEST
        name: "<gradient:#8e2de2:#4a00e0><bold>Dungeons</bold></gradient>"
        lore:
          - "<gray>Ver y editar todas las dungeons."
          - "<dark_gray>Clic para abrir"
        glow: true
      create:
        slot: 13
        material: EMERALD_BLOCK
        name: "<green><bold>Crear dungeon</bold></green>"
        lore:
          - "<gray>Crea una dungeon nueva."
          - "<dark_gray>Clic para escribir el ID"
      reload:
        slot: 15
        material: CLOCK
        name: "<yellow><bold>Recargar</bold></yellow>"
        lore:
          - "<gray>Recarga configuracion, mensajes"
          - "<gray>y menus sin reiniciar."
      close:
        slot: 22
        material: BARRIER
        name: "<red><bold>Cerrar</bold></red>"

  dungeon-list:
    title: "<dark_gray>» <gradient:#8e2de2:#4a00e0><bold>Dungeons</bold></gradient>"
    size: 54
    list-slots: "10-16,19-25,28-34"
    items:
      fill:
        material: BLACK_STAINED_GLASS_PANE
        name: " "
      dungeon-entry:
        material: MAP
        name: "<gradient:#8e2de2:#4a00e0><bold>{name}</bold></gradient>"
        lore:
          - "<dark_gray>ID: <white>{dungeon}</white>"
          - "<gray>Estado: <white>{state}</white>"
          - "<gray>Jugadores: <white>{players}<gray>/<white>{max_players}</white>"
          - "<gray>Mundo: <white>{world}</white>"
          - "<gray>Activa: {enabled} <dark_gray>| <gray>Lista: {ready}"
          - "<gray>Spawns: <white>{spawns}</white> <dark_gray>| <gray>Jefes: <white>{bosses}</white>"
          - "<gray>Cofres: <white>{chests}</white> <dark_gray>| <gray>Loot: <white>{loot}</white>"
          - ""
          - "<green>Clic izquierdo <gray>para editar"
          - "<yellow>Clic derecho <gray>para activar/desactivar"
          - "<red>Shift + clic derecho <gray>para borrar"
      empty:
        material: BARRIER
        name: "<red>No hay dungeons</red>"
        lore:
          - "<gray>Usa el boton verde para crear una."
      prev:
        slot: 45
        material: ARROW
        name: "<gray><bold>Pagina anterior</bold>"
      next:
        slot: 53
        material: ARROW
        name: "<gray><bold>Pagina siguiente</bold>"
      back:
        slot: 49
        material: OAK_DOOR
        name: "<gray><bold>Volver</bold>"
      create:
        slot: 48
        material: EMERALD_BLOCK
        name: "<green><bold>Crear dungeon</bold></green>"
        lore:
          - "<gray>Clic para escribir el ID."

  dungeon-editor:
    title: "<dark_gray>» <gradient:#8e2de2:#4a00e0><bold>{dungeon_name}</bold></gradient>"
    size: 54
    items:
      fill:
        material: BLACK_STAINED_GLASS_PANE
        name: " "
      info:
        slot: 4
        material: PAPER
        name: "<gradient:#8e2de2:#4a00e0><bold>{name}</bold></gradient>"
        lore:
          - "<dark_gray>ID: <white>{dungeon}</white>"
          - "<gray>Estado: <white>{state}</white>"
          - "<gray>Jugadores: <white>{players}<gray>/<white>{max_players}</white>"
          - "<gray>Region: <white>{region}</white>"
          - "<gray>Entrada: <white>{entry}</white>"
          - "<gray>Salida: <white>{exit}</white>"
          - "<gray>Activa: {enabled} <dark_gray>| <gray>Lista: {ready}"
      settings:
        slot: 19
        material: COMPARATOR
        name: "<yellow><bold>Ajustes</bold></yellow>"
        lore:
          - "<gray>Tiempo, jugadores, proteccion,"
          - "<gray>auto-entrada, bossbar y mas."
      spawns:
        slot: 20
        material: ZOMBIE_HEAD
        name: "<green><bold>Spawns</bold></green>"
        lore:
          - "<gray>Cantidad: <white>{spawns}</white>"
          - "<gray>Configura mobs, intervalos y zonas seguras."
      bosses:
        slot: 21
        material: WITHER_SKELETON_SKULL
        name: "<red><bold>Jefes</bold></red>"
        lore:
          - "<gray>Cantidad: <white>{bosses}</white>"
          - "<gray>Incluye mobs de MythicMobs."
      loot:
        slot: 22
        material: BOOK
        name: "<aqua><bold>Tablas de loot</bold></aqua>"
        lore:
          - "<gray>Tablas: <white>{loot}</white>"
      chests:
        slot: 23
        material: CHEST
        name: "<gold><bold>Cofres</bold></gold>"
        lore:
          - "<gray>Cofres: <white>{chests}</white>"
      rewards:
        slot: 24
        material: GOLD_BLOCK
        name: "<gold><bold>Bloques premiados</bold></gold>"
        lore:
          - "<gray>Bloques: <white>{rewards}</white>"
      toggle:
        slot: 29
        material: LEVER
        name: "<yellow><bold>Activar / desactivar</bold></yellow>"
        lore:
          - "<gray>Activa ahora: {enabled}"
          - "<dark_gray>Clic para cambiar"
      pos1:
        slot: 30
        material: ARROW
        name: "<white><bold>Esquina 1</bold>"
        lore:
          - "<gray>Usa tu posicion actual como esquina 1."
      pos2:
        slot: 31
        material: ARROW
        name: "<white><bold>Esquina 2</bold>"
        lore:
          - "<gray>Usa tu posicion actual como esquina 2."
      save-region:
        slot: 32
        material: LIME_DYE
        name: "<green><bold>Guardar region</bold></green>"
        lore:
          - "<gray>Guarda la region con las dos esquinas."
          - "<gray>Actual: <white>{region}</white>"
      entry:
        slot: 38
        material: ENDER_PEARL
        name: "<light_purple><bold>Punto de entrada</bold></light_purple>"
        lore:
          - "<gray>Actual: <white>{entry}</white>"
          - "<dark_gray>Clic para usar tu posicion"
      exit:
        slot: 39
        material: ENDER_EYE
        name: "<light_purple><bold>Punto de salida</bold></light_purple>"
        lore:
          - "<gray>Actual: <white>{exit}</white>"
          - "<dark_gray>Clic para usar tu posicion"
      start:
        slot: 40
        material: LIME_CONCRETE
        name: "<green><bold>Iniciar</bold></green>"
        lore:
          - "<gray>Inicia una partida de esta dungeon."
      stop:
        slot: 41
        material: RED_CONCRETE
        name: "<red><bold>Detener</bold></red>"
        lore:
          - "<gray>Detiene la partida actual."
      reset:
        slot: 42
        material: WATER_BUCKET
        name: "<aqua><bold>Reiniciar</bold></aqua>"
        lore:
          - "<gray>Detiene y limpia la partida."
      delete:
        slot: 49
        material: TNT
        name: "<dark_red><bold>Borrar dungeon</bold></dark_red>"
        lore:
          - "<gray>Elimina la dungeon y todos sus datos."
          - "<red>Esta accion no se puede deshacer."
      back:
        slot: 45
        material: OAK_DOOR
        name: "<gray><bold>Volver</bold>"

