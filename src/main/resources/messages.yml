# ============================================================
#  QSDungeons - Mensajes
#  Formato: MiniMessage (https://docs.advntr.dev/minimessage/format.html)
#  Placeholders internos: {prefix} {player} {dungeon} {dungeon_name}
#    {state} {players} {max_players} {time} {kills} {total} {progress}
#    {progress_bar} {boss} {boss_health} {boss_max_health} {boss_percent}
#  Tambien puedes usar PlaceholderAPI: %qsdungeons_dungeon%, etc.
# ============================================================

prefix: "<gradient:#8e2de2:#4a00e0><bold>QS</bold></gradient> <dark_gray>»</dark_gray> "

general:
  no-permission: "{prefix}<red>No tienes permiso para hacer eso."
  player-only: "{prefix}<red>Este comando solo puede usarlo un jugador."
  unknown-dungeon: "{prefix}<red>La dungeon <white>{dungeon}</white> no existe."
  unknown-subcommand: "{prefix}<red>Subcomando desconocido: <white>{arg}</white>."
  usage: "{prefix}<red>Uso: <white>{usage}</white>"
  reloaded: "{prefix}<green>Configuracion, mensajes y dungeons recargados."
  invalid-number: "{prefix}<red><white>{value}</white> no es un numero valido."
  player-not-found: "{prefix}<red>El jugador <white>{player}</white> no esta conectado."
  file-not-found: "{prefix}<red>No se encontro el archivo <white>{file}</white>."
  worldedit-missing: "{prefix}<red>WorldEdit no esta instalado. Esta funcion necesita WorldEdit."
  mythic-missing: "{prefix}<red>MythicMobs no esta instalado o no esta activo."
  not-in-dungeon: "{prefix}<red>No estas dentro de ninguna dungeon."
  already-in-dungeon: "{prefix}<red>Ya estas dentro de una dungeon."
  confirm: "{prefix}<yellow>Ejecuta el comando otra vez con <white>{confirm}</white> para confirmar."
  error: "{prefix}<red>Ocurrio un error: <white>{error}</white>"
  enabled: "{prefix}<green>La dungeon <white>{dungeon}</white> fue activada."
  disabled: "{prefix}<yellow>La dungeon <white>{dungeon}</white> fue desactivada."

command:
  help:
    header: "<dark_gray><strikethrough>                                                  </strikethrough>"
    title: "<gradient:#8e2de2:#4a00e0><bold>QSDungeons</bold></gradient> <dark_gray>| <gray>Comandos"
    player: "<white>/dungeon menu <dark_gray>- <gray>Ver y entrar a dungeons habilitadas\n<white>/dungeon list <dark_gray>- <gray>Lista las dungeons\n<white>/dungeon info [id] <dark_gray>- <gray>Informacion de una dungeon\n<white>/dungeon join <id> <dark_gray>- <gray>Entrar a una dungeon\n<white>/dungeon leave <dark_gray>- <gray>Salir de la dungeon"
    admin: "<white>/dungeon editor [id] <dark_gray>- <gray>Abrir el editor grafico\n<white>/dungeon create <id> <dark_gray>- <gray>Crear dungeon\n<white>/dungeon delete <id> <dark_gray>- <gray>Borrar dungeon\n<white>/dungeon pos1 | pos2 <dark_gray>- <gray>Marcar esquinas\n<white>/dungeon region <id> <dark_gray>- <gray>Guardar region\n<white>/dungeon entry <id> <dark_gray>- <gray>Punto de entrada\n<white>/dungeon exit <id> <dark_gray>- <gray>Punto de salida\n<white>/dungeon cooldown-location <dark_gray>- <gray>Guardar ubicacion de expulsion\n<white>/dungeon cooldown-protection [on|off|toggle] <dark_gray>- <gray>Expulsion por cooldown\n<white>/dungeon protection [on|off|toggle] <dark_gray>- <gray>Permitir bypass de proteccion\n<white>/dungeon spawn add <id> <spawnId> <dark_gray>- <gray>Crear spawn de mob\n<white>/dungeon boss create <id> <bossId> <dark_gray>- <gray>Crear jefe\n<white>/dungeon loot create <id> <lootId> <dark_gray>- <gray>Crear tabla de loot\n<white>/dungeon loot add <id> <lootId> <dark_gray>- <gray>Añadir item en mano\n<white>/dungeon chest add <id> <chestId> <lootId> <dark_gray>- <gray>Registrar cofre\n<white>/dungeon reward add <id> <rewardId> <lootId> <dark_gray>- <gray>Registrar bloque premiado\n<white>/dungeon start | stop | reset <id> <dark_gray>- <gray>Controlar dungeon\n<white>/dungeon reload <dark_gray>- <gray>Recargar todo"
    transfer: "<white>/dungeon export <id> config <dark_gray>- <gray>Exportar configuracion (.zip)\n<white>/dungeon save <id> <nombre> <dark_gray>- <gray>Guardar estructura (.schem)\n<white>/dungeon export <id> all [nombre] <dark_gray>- <gray>Exportar todo\n<white>/dungeon import <id> <archivo> <dark_gray>- <gray>Importar config o estructura\n<white>/dungeon paste <id> <nombre> <dark_gray>- <gray>Pegar estructura en tu posicion\n<white>/dungeon wand <dark_gray>- <gray>Obtener el hacha de WorldEdit"
  created: "{prefix}<green>Dungeon <white>{dungeon}</white> creada. Configura su region con <white>/dungeon pos1</white>, <white>pos2</white> y <white>/dungeon region {dungeon}</white>."
  exists: "{prefix}<red>La dungeon <white>{dungeon}</white> ya existe."
  invalid-id: "{prefix}<red>El identificador <white>{id}</white> no es valido. Usa letras, numeros, guiones o guiones bajos (maximo 32)."
  list-empty: "{prefix}<gray>No hay dungeons cargadas."
  list-header: "{prefix}<gradient:#8e2de2:#4a00e0><bold>Dungeons</bold></gradient> <dark_gray>({amount})"
  list-entry: "{prefix}<white>{dungeon}</white> <dark_gray>- <gray>{state} <dark_gray>| <gray>{players}<dark_gray>/<white>{max_players} <gray>jugadores <dark_gray>| <gray>activa: <white>{enabled}</white> <dark_gray>| <gray>lista: <white>{ready}"
  info: "{prefix}<gradient:#8e2de2:#4a00e0><bold>{dungeon_name}</bold></gradient> <dark_gray>({dungeon})\n<gray>Estado: <white>{state} <dark_gray>| <gray>Activa: <white>{enabled} <dark_gray>| <gray>Lista: <white>{ready}\n<gray>Jugadores: <white>{players}<gray>/<white>{max_players}\n<gray>Region: <white>{region}\n<gray>Entrada: <white>{entry}\n<gray>Salida: <white>{exit}\n<gray>Jefes: <white>{bosses} <dark_gray>| <gray>Spawns: <white>{spawns} <dark_gray>| <gray>Cofres: <white>{chests}\n<gray>Bloques premiados: <white>{rewards} <dark_gray>| <gray>Tablas de loot: <white>{loot}"
  pos1: "{prefix}<green>Esquina 1 marcada en <white>{location}</white>."
  pos2: "{prefix}<green>Esquina 2 marcada en <white>{location}</white>."
  block-target: "{prefix}<red>Mira a un bloque valido (a menos de 10 bloques) o colocate sobre el."
  chest-invalid: "{prefix}<red>El bloque seleccionado no es un cofre."
  loot-exists: "{prefix}<red>La tabla de loot <white>{loot}</white> ya existe."
  chest-list: "{prefix}<gray>Cofres: <white>{chests}</white>"
  reward-list: "{prefix}<gray>Bloques premiados: <white>{rewards}</white>"
