  spawn-added: "{prefix}<green>Spawn <white>{spawn}</white> añadido a <white>{dungeon}</white> (<white>{amount}</white> mobs, tipo <white>{type}</white>)."
  spawn-removed: "{prefix}<green>Spawn <white>{spawn}</white> eliminado."
  spawn-not-found: "{prefix}<red>El spawn <white>{spawn}</white> no existe."
  spawn-list: "{prefix}<gray>Spawns: <white>{spawns}</white>"
  boss-created: "{prefix}<green>Jefe <white>{boss}</white> creado en <white>{dungeon}</white>."
  boss-removed: "{prefix}<green>Jefe <white>{boss}</white> eliminado."
